name: Update BeninWebTV RSS

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate RSS
        run: python beninwebtv-radar/generate_rss.py

      - name: Enrich RSS metadata
        run: python beninwebtv-radar/enrich_rss.py

      - name: Split RSS feeds
        run: python beninwebtv-radar/split_feeds.py

      - name: Commit updated feeds
        run: |
          git config user.name "beninwebtv-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add beninwebtv-radar/rss.xml \
                  beninwebtv-radar/benin.xml \
                  beninwebtv-radar/international.xml \
                  beninwebtv-radar/people.xml \
                  beninwebtv-radar/faits-divers.xml \
                  beninwebtv-radar/sport.xml
          git diff --cached --quiet && exit 0
          git commit -m "Update BeninWebTV RSS feeds"
          git push
